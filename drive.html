<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#05070c">
    <meta name="color-scheme" content="dark">
    <title>Nyetir Jakarta — Yoyo Budianto</title>
    <link rel="stylesheet" href="css/drive.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="stage"></div>

    <div id="loading">
        <div class="loader-car"></div>
        <p>Menyiapkan mobil di Sudirman…</p>
    </div>

    <header class="hud-top">
        <div>
            <div class="kicker">Jakarta Drive</div>
            <h1 id="car-name">458 ITALIA</h1>
        </div>
        <div class="hud-links">
            <a class="ghost" href="visualizer.html">Showroom</a>
            <a class="ghost" href="index.html">Profil</a>
        </div>
    </header>

    <label class="car-pick">
        <span>Mobil</span>
        <select id="car-select"></select>
    </label>

    <div id="speedo"><span id="speed-num">0</span> km/h</div>

    <p class="hint" id="hint">W A S D atau panah untuk nyetir</p>

    <div id="touch" hidden>
        <button type="button" id="btn-left" aria-label="Kiri">◀</button>
        <button type="button" id="btn-brake" aria-label="Rem">REM</button>
        <button type="button" id="btn-gas" aria-label="Gas">GAS</button>
        <button type="button" id="btn-right" aria-label="Kanan">▶</button>
    </div>

    <p class="credit">Mobil dari showroom · citra satelit Esri / Maxar · gedung OpenStreetMap</p>

    <script type="module" src="js/drive.js"></script>
</body>
</html>
