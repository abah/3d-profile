<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#6aa34a">
    <meta name="color-scheme" content="dark">
    <title>Sirkuit GP — Yoyo Budianto</title>
    <link rel="stylesheet" href="css/drive.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="stage"></div>

    <div id="loading">
        <div class="loader-car"></div>
        <p>Memuat sirkuit…</p>
    </div>

    <header class="hud-top">
        <div>
            <div class="kicker">Sirkuit klub</div>
            <h1 id="car-name">458 ITALIA</h1>
        </div>
        <div class="hud-links">
            <a class="ghost" href="visualizer.html">Showroom</a>
            <a class="ghost" href="jakarta.html">Jakarta</a>
        </div>
    </header>

    <label class="car-pick">
        <span>Mobil</span>
        <select id="car-select"></select>
    </label>

    <div id="speedo"><span id="speed-num">0</span> km/h</div>

    <p class="hint" id="hint">W maju · A D belok · S ngerem — tidak bisa mundur</p>

    <div id="touch" hidden>
        <div class="stick" id="stick-left" aria-label="Kemudi">
            <div class="stick-base"></div>
            <div class="stick-knob"></div>
        </div>
        <div class="stick" id="stick-right" aria-label="Gas">
            <div class="stick-base"></div>
            <div class="stick-knob"></div>
        </div>
    </div>

    <p class="credit">Lap tertutup buatan sendiri · pohon hanya di luar aspal</p>

    <script type="module" src="js/drive.js"></script>
</body>
</html>
